<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="fn" data-action="clear">AC</button>
            <button class="fn" data-action="delete">DEL</button>
            <button class="op" data-value="%">%</button>
            <button class="op" data-value="÷">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="op" data-value="×">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="op" data-value="-">-</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="op" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="equal">=</button>
        </div>

        <div class="history">
            <div class="history-header">
                <h2>Historique</h2>
                <button id="clear-history" class="clear-history">Effacer</button>
            </div>
            <ul id="history-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
